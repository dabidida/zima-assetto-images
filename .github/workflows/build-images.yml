
name: Build pinned AssettoServer and Panel images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Normalize GitHub username
        id: owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download official AssettoServer source
        uses: actions/checkout@v4
        with:
          repository: compujuckel/AssettoServer
          ref: v0.0.55-pre42
          path: assettoserver-src

      - name: Build AssettoServer
        uses: docker/build-push-action@v6
        with:
          context: ./assettoserver-src
          file: ./assettoserver-src/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/assetto-server:0.0.55-pre42

      - name: Download Assetto Server Panel source
        uses: actions/checkout@v4
        with:
          repository: ayozetr/assetto-server-panel
          ref: v1.8.0
          path: panel-src

      - name: Build Assetto Server Panel
        uses: docker/build-push-action@v6
        with:
          context: ./panel-src
          file: ./panel-src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/assetto-server-panel:1.8.0
